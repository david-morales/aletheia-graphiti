name: MCP Server Tests

# Live end-to-end tests for the Graphiti MCP server against FalkorDB (the default
# database) and a real OpenAI model. Runs on PRs and pushes to main that touch the
# MCP server. The OpenAI key comes from the `development` GitHub environment; fork
# PRs receive no secrets, so the suite skips itself there (the test module skips
# when OPENAI_API_KEY is unset).
on:
  push:
    branches: [main]
    paths:
      - "mcp_server/**"
      - ".github/workflows/mcp-server-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "mcp_server/**"
      - ".github/workflows/mcp-server-tests.yml"

permissions:
  contents: read

# Cancel superseded runs on the same ref so repeated pushes don't keep paying for
# real OpenAI calls.
concurrency:
  group: mcp-server-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The ADR-015/019 surface guards: annotations, typed flat output schemas, the
  # instructions catalog, domain-free served text, and the SDK envelope premise
  # they all rest on. They need no database and no API key, so unlike the live job
  # below they also run on fork PRs — which is the point: until this job existed,
  # nothing in CI executed them at all (2026-08-06 MCP analysis, F3).
  #
  # Selection is by marker, not by filename: a new guard joins CI by declaring
  # `pytestmark = pytest.mark.contract`, and tests/test_mcp_contract_lint.py
  # asserts each known guard has done so.
  contract-lint:
    runs-on: depot-ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: mcp_server
        run: uv sync
      - name: Run the MCP contract guards
        working-directory: mcp_server
        # No `exit 5` tolerance here, deliberately: these tests never self-skip, so
        # an empty collection means the marker stopped selecting them.
        #
        # The --ignore list is five modules that fail at COLLECTION on `aletheia`
        # today — stale imports (`is_non_openai_provider`, `EdgeTypeConfig`) and a
        # `from test_fixtures import ...` that a packaged tests/ directory cannot
        # resolve. Marker selection happens after collection, so one broken import
        # anywhere under tests/ would take this job down with it. None of the five
        # carries the contract marker, and test_mcp_contract_lint.py asserts that —
        # so this list cannot become a way to silence a guard.
        run: |
          uv run pytest tests/ -m contract -p no:cacheprovider \
            --ignore=tests/test_async_operations.py \
            --ignore=tests/test_core_parity.py \
            --ignore=tests/test_factories.py \
            --ignore=tests/test_fixtures.py \
            --ignore=tests/test_stress_load.py

  live-mcp-tests:
    runs-on: depot-ubuntu-22.04
    environment: development
    # Insurance against a hung stdio subprocess / uv sync.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"
      - name: Start FalkorDB
        # Run the database on the host network rather than a `services:` block: on
        # the depot-ubuntu runner pool bridge-network NAT silently drops packets to
        # published service-container ports. Readiness is checked via `docker exec`.
        run: docker run -d --name falkordb --network host falkordb/falkordb:latest
      - name: Install dependencies
        working-directory: mcp_server
        run: uv sync
      - name: Wait for FalkorDB
        run: |
          for i in $(seq 1 30); do
            if docker exec falkordb redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "falkordb ready after ${i}s"; break
            fi
            if [ "$i" -eq 30 ]; then echo "falkordb did not become ready in 30s" >&2; docker logs falkordb; exit 1; fi
            sleep 1
          done
      - name: Run live MCP integration tests
        working-directory: mcp_server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FALKORDB_URI: redis://localhost:6379
          # gpt-5.5 is the server's runtime default, but it requires a key/account
          # with fast gpt-5.5 access; CI pins a lighter, broadly-available model so
          # the live test stays fast and reliable. It exercises the same pipeline.
          MODEL_NAME: gpt-4.1-mini
          # Raise episode/LLM-call concurrency so the live episode processes quickly.
          SEMAPHORE_LIMIT: "20"
        # pytest exits 5 when no tests are collected — which happens when the suite
        # self-skips (a fork PR has no OPENAI_API_KEY, or FalkorDB is unreachable).
        # Treat that as success rather than a CI failure; any real test failure
        # (exit 1) still fails the job.
        run: |
          set +e
          uv run pytest tests/test_live_falkordb_int.py -m integration -p no:cacheprovider
          code=$?
          if [ "$code" -eq 5 ]; then
            echo 'No live tests ran (suite self-skipped — no OpenAI key / FalkorDB); treating as success.'
            exit 0
          fi
          exit "$code"
