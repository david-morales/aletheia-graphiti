# Graphiti MCP Server Configuration - Safety Recommendations
# EASA Safety Recommendations data from aviation safety investigation authorities

server:
  transport: "stdio"
  host: "127.0.0.1"
  port: 8000

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  max_tokens: 4096

  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: "https://api.openai.com/v1"

embedder:
  provider: "openai"
  model: "text-embedding-3-small"
  dimensions: 1024

  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: "https://api.openai.com/v1"

database:
  provider: "falkordb"

  providers:
    falkordb:
      uri: "redis://localhost:6379"
      database: "safety_recommendations"

graphiti:
  group_id: "safety_recommendations"
  user_id: "claude_desktop"
  entity_types:
    - name: "Occurrence"
      description: "Aviation occurrence (accident, incident, serious incident, or study) that triggered safety recommendations"
    - name: "SafetyRecommendation"
      description: "Formal safety recommendation issued by a Safety Investigation Authority to EASA"
    - name: "Aircraft"
      description: "Aircraft involved in an occurrence, including type and registration"
    - name: "Manufacturer"
      description: "Aircraft or component manufacturer (Type Certificate Holder)"
    - name: "SafetyInvestigationAuthority"
      description: "National Safety Investigation Authority (SIA) like BEA, BFU, AAIB that issues safety recommendations"
    - name: "Country"
      description: "Country where an SIA is based or where an occurrence happened"
