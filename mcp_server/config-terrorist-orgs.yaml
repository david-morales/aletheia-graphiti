# Graphiti MCP Server Configuration - Terrorist Organizations

server:
  transport: "stdio"
  host: "127.0.0.1"
  port: 8000

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  max_tokens: 4096

  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: "https://api.openai.com/v1"

embedder:
  provider: "openai"
  model: "text-embedding-3-small"
  dimensions: 1024

  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: "https://api.openai.com/v1"

database:
  provider: "falkordb"

  providers:
    falkordb:
      uri: "redis://localhost:6379"
      database: "terrorist_orgs"

graphiti:
  group_id: "terrorist_orgs"
  ontology_graph: "followthemoney"
  user_id: "claude_desktop"
  entity_types:
    - name: "Organization"
      description: "Terrorist organization entity"
    - name: "Person"
      description: "Person associated with organization"
    - name: "Sanction"
      description: "Sanction or designation"
    - name: "Authority"
      description: "Sanctioning authority (US State Dept, UK, etc.)"
