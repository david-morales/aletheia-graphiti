[pytest]
# Pytest configuration for Graphiti MCP integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring external services
    unit: marks tests as unit tests
    stress: marks tests as stress/load tests
    requires_neo4j: test requires Neo4j database
    requires_falkordb: test requires FalkorDB
    requires_openai: test requires OpenAI API key
    contract: ADR-015/019 surface guards — no database, no API key, runs in CI on every change
    # Registered here as well as by pytest-timeout, because `--strict-markers` is on
    # and the plugin is a DEV dependency: a bare interpreter without it would fail to
    # collect any module carrying `@pytest.mark.timeout` rather than simply ignoring
    # the marker. Registering it keeps that asymmetry from being an error.
    timeout: per-test wall-clock ceiling (pytest-timeout); overrides the `timeout` ini value below

# Test output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -p no:warnings

# Timeout for tests (seconds)
timeout = 300

# Coverage options
testpaths = tests

# Environment variables for testing
env =
    TEST_MODE=true
    LOG_LEVEL=INFO